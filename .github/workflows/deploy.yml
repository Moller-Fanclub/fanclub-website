name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
    - uses: actions/checkout@v4

    - name: Install cloudflared
      run: |
        curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb

    - name: Configure SSH over Cloudflare Access
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        cat > ~/.ssh/config <<CFG
        Host deploy
          HostName ${{ secrets.SSH_HOSTNAME }}
          User ${{ secrets.DEPLOY_USER }}
          IdentityFile ~/.ssh/id_deploy
          StrictHostKeyChecking accept-new
          ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        CFG
        sed -i 's/^        //' ~/.ssh/config

    - name: Sync source
      run: |
        rsync -az --delete \
          --exclude '.git' --exclude '.github' --exclude 'node_modules' \
          --exclude 'dist' --exclude '.env' --exclude 'studio-moller-fanclub' \
          ./ deploy:"$DEPLOY_PATH"/

    - name: Write .env on server from secrets
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://mollerfan.club' }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_FROM_SHOP: ${{ secrets.EMAIL_FROM_SHOP }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        VIPPS_CLIENT_ID: ${{ secrets.VIPPS_CLIENT_ID }}
        VIPPS_CLIENT_SECRET: ${{ secrets.VIPPS_CLIENT_SECRET }}
        VIPPS_SUBSCRIPTION_KEY: ${{ secrets.VIPPS_SUBSCRIPTION_KEY }}
        VIPPS_MSN: ${{ secrets.VIPPS_MSN }}
        VIPPS_CALLBACK_URL: ${{ secrets.VIPPS_CALLBACK_URL }}
        VIPPS_CALLBACK_AUTHORIZATION_TOKEN: ${{ secrets.VIPPS_CALLBACK_AUTHORIZATION_TOKEN }}
        VIPPS_API_BASE_URL: ${{ secrets.VIPPS_API_BASE_URL }}
        BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
        BRING_API_UID: ${{ secrets.BRING_API_UID }}
        BRING_CUSTOMER_NUMBER: ${{ secrets.BRING_CUSTOMER_NUMBER }}
        SENDER_POSTAL_CODE: ${{ secrets.SENDER_POSTAL_CODE }}
      run: |
        {
          for v in POSTGRES_PASSWORD BETTER_AUTH_SECRET FRONTEND_URL EMAIL_USER EMAIL_FROM_SHOP \
                   AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID \
                   VIPPS_CLIENT_ID VIPPS_CLIENT_SECRET VIPPS_SUBSCRIPTION_KEY VIPPS_MSN \
                   VIPPS_CALLBACK_URL VIPPS_CALLBACK_AUTHORIZATION_TOKEN VIPPS_API_BASE_URL \
                   BRING_API_KEY BRING_API_UID BRING_CUSTOMER_NUMBER SENDER_POSTAL_CODE; do
            printf '%s=%s\n' "$v" "${!v}"
          done
          printf 'BETTER_AUTH_URL=%s\n' "$FRONTEND_URL"
        } | ssh deploy "umask 077 && cat > $DEPLOY_PATH/.env"

    - name: Build and restart
      run: |
        ssh deploy "cd $DEPLOY_PATH && docker compose up -d --build --remove-orphans && docker image prune -f"
